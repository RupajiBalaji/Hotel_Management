# Render Blueprint Specification for HotelMind AI
# Docs: https://render.com/docs/blueprint-spec

services:
  # Option 1: High-Performance Static Site (Recommended on Render Free Tier)
  - type: web
    name: hotelmind-ai
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA rewrite rule so React Router routes (/dashboard, /guest-portal, /agents, etc.) don't 404
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.x
